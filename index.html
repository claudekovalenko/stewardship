<style>
:root{
  --paper:#F3F1EC;
  --glow:#E8EAE3;
  --ink:#1A1D1B;
  --ink-2:#565E59;
  --ink-3:#8B938E;
  --rule:#DEDCD3;
  --rule-2:#C7C5BA;

  --deep:#15544A;
  --current:#3B8B77;
  --blessing:#9A6A2A;
  --joy:#C4883A;
  --future:#8A8672;

  --on-deep:#F3F1EC;
  --f-display:"Spectral", Georgia, "Times New Roman", serif;
  --f-ui:"Public Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0E1210; --glow:#171D1A; --ink:#E9EBE5; --ink-2:#A7AFA9; --ink-3:#79817C;
    --rule:#222825; --rule-2:#333A36;
    --deep:#4FB69C; --current:#3E8F7A; --blessing:#C79245; --joy:#D9A85B; --future:#8E8A76;
    --on-deep:#08100D;
  }
}
:root[data-theme="dark"]{
  --paper:#0E1210; --glow:#171D1A; --ink:#E9EBE5; --ink-2:#A7AFA9; --ink-3:#79817C;
  --rule:#222825; --rule-2:#333A36;
  --deep:#4FB69C; --current:#3E8F7A; --blessing:#C79245; --joy:#D9A85B; --future:#8E8A76;
  --on-deep:#08100D;
}

*{box-sizing:border-box}
body{
  background:var(--paper);color:var(--ink);
  font-family:var(--f-ui);font-size:15px;line-height:1.5;
  -webkit-font-smoothing:antialiased;
  margin:0;padding:0 18px 34px;
  background-image:radial-gradient(ellipse 76% 52% at 50% 36%, var(--glow), transparent 70%);
}
.wrap{max-width:1000px;margin:0 auto}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:1.5px solid var(--current);outline-offset:3px;border-radius:3px}

header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;
  gap:10px 22px;padding:20px 0 6px}
h1{font-family:var(--f-display);font-size:23px;font-weight:600;margin:0;letter-spacing:-.02em}
h1 .amp{font-style:italic;font-weight:400;color:var(--ink-3);padding:0 .04em}
.sub{font-family:var(--f-display);font-style:italic;font-size:13.5px;color:var(--ink-2);margin:3px 0 0}

.seg{display:flex;border:1px solid var(--rule-2);border-radius:999px;padding:2px;flex:none}
.seg button{border-radius:999px;padding:6px 15px;font-size:12px;font-weight:600;
  letter-spacing:.04em;color:var(--ink-3);white-space:nowrap;
  transition:background .16s ease,color .16s ease}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}

/* ---------- the field ---------- */
svg{display:block;width:100%;height:auto;overflow:visible}
.bubble{cursor:pointer}
.bubble circle{stroke-width:1.25;transition:opacity .35s ease,stroke-width .15s ease}
.bubble text{
  font-family:var(--f-display);font-weight:500;pointer-events:none;
  transition:opacity .35s ease;
}
.b-deep circle{fill:var(--deep);stroke:var(--deep)}
.b-deep text{fill:var(--on-deep)}
.b-current circle{fill:color-mix(in srgb,var(--current) 30%,transparent);stroke:var(--current)}
.b-current text{fill:var(--ink)}
.b-blessing circle{fill:color-mix(in srgb,var(--blessing) 16%,transparent);stroke:var(--blessing)}
.b-joy circle{fill:color-mix(in srgb,var(--joy) 16%,transparent);stroke:var(--joy)}
.b-future circle{fill:transparent;stroke:var(--future);stroke-dasharray:3 3.5}
.b-blessing text,.b-joy text,.b-future text{fill:var(--ink-2)}
.bubble:hover circle{stroke-width:2.5}
.bubble.sel circle{stroke-width:3.5}

/* a thing tied to the concept it serves */
.tie{stroke:var(--deep);stroke-width:1.6;opacity:.55;transition:opacity .35s ease}
.ring{fill:none;stroke-width:2.5;stroke-linecap:round;transition:opacity .35s ease}
.b-deep .ring{stroke:var(--deep)}
.b-current .ring{stroke:var(--current)}
.b-blessing .ring{stroke:var(--blessing)}
.b-joy .ring{stroke:var(--joy)}
.b-future .ring{stroke:var(--future)}

/* the key ringing the outside */
.lead{stroke:var(--rule-2);stroke-width:1;fill:none;transition:opacity .35s ease}
.keytext{
  font-family:var(--f-ui);font-size:10.5px;fill:var(--ink-2);
  transition:opacity .35s ease;
}
.keyrow{cursor:pointer}
/* The leader is a 1px line and the text glyphs are thin, so give each key
   entry a real target to tap. */
.keyrow .hit{fill:transparent}
.keyrow:hover .keytext{fill:var(--ink)}
.keyrow:hover .lead{stroke:var(--ink-3)}
.keydot{transition:opacity .35s ease}
.sel-key .keytext{fill:var(--ink);font-weight:600}
.sel-key .lead{stroke:var(--ink-3)}

svg.mode-carry .g-other circle,svg.mode-carry .g-other text,
svg.mode-carry .g-other .lead,svg.mode-carry .g-other .keydot,
svg.mode-carry line.tie.g-other{opacity:.14}
svg.mode-bless .g-carry circle,svg.mode-bless .g-carry text,
svg.mode-bless .g-carry .lead,svg.mode-bless .g-carry .keydot,
svg.mode-bless line.tie.g-carry{opacity:.14}

/* ---------- key beneath, on narrow screens ---------- */
.keylist{display:none;margin:14px auto 0;max-width:520px;
  columns:2;column-gap:22px;font-size:12px;color:var(--ink-2)}
.keylist.on{display:block}
.keylist div{break-inside:avoid;padding:2px 0}
.keylist b{font-weight:600;color:var(--ink)}
.keylist i{font-style:normal;display:inline-block;width:7px;height:7px;border-radius:50%;
  margin-right:6px;border:1.25px solid}

.legend{display:flex;flex-wrap:wrap;gap:5px 16px;justify-content:center;
  padding:8px 0 0;font-size:11px;color:var(--ink-3)}
.legend b{font-weight:600;letter-spacing:.08em;text-transform:uppercase;font-size:10px}
.key{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;
  vertical-align:-1px;border:1.25px solid}
.k-deep{background:var(--deep);border-color:var(--deep)}
.k-current{background:color-mix(in srgb,var(--current) 30%,transparent);border-color:var(--current)}
.k-blessing{background:color-mix(in srgb,var(--blessing) 16%,transparent);border-color:var(--blessing)}
.k-joy{background:color-mix(in srgb,var(--joy) 16%,transparent);border-color:var(--joy)}
.k-future{background:transparent;border-color:var(--future);border-style:dotted}

/* ---------- detail ---------- */
.detail{max-width:500px;margin:12px auto 0;padding:14px 16px;
  border:1px solid var(--rule-2);border-radius:10px;background:var(--paper)}
.detail[hidden]{display:none}
.d-tier{font-size:10px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;margin-bottom:8px}
.d-lab{font-size:9.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;
  color:var(--ink-3);display:block;margin:9px 0 1px}
.d-label,.d-name,.d-note{display:block;width:100%;background:none;border:0;
  resize:none;overflow:hidden;font-family:var(--f-display)}
.d-label{font-size:21px;font-weight:600;line-height:1.2;padding:1px 0}
.d-name{font-size:15px;line-height:1.35;padding:1px 0}
.d-note{font-style:italic;font-size:13.5px;color:var(--ink-2);line-height:1.45;padding:1px 0}
.d-label:focus,.d-name:focus,.d-note:focus{outline:none;box-shadow:inset 0 -1px 0 var(--rule-2)}
.d-note::placeholder,.d-name::placeholder{color:var(--ink-3)}
.d-serves{background:transparent;border:1px solid var(--rule-2);border-radius:999px;
  padding:5px 10px;font-size:12.5px;color:var(--ink-2);max-width:100%}
.d-rank{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.d-rank button{border:1px solid var(--rule-2);border-radius:999px;width:28px;height:24px;
  font-size:9px;color:var(--ink-2);line-height:1}
.d-rank button:hover:not(:disabled){border-color:var(--ink-3);color:var(--ink)}
.d-rank button:disabled{opacity:.3;cursor:default}
.d-rank b{font-size:12.5px;font-weight:600;color:var(--ink-2);margin-left:2px}
.d-rank-why{font-family:var(--f-display);font-style:italic;font-size:12px;color:var(--ink-3)}
.d-pct{display:flex;align-items:center;gap:10px}
.d-pct input{flex:1;min-width:0;accent-color:var(--current)}
.d-pct b{font-family:var(--f-ui);font-size:12px;font-weight:600;color:var(--ink-2);
  min-width:38px;text-align:right;font-variant-numeric:tabular-nums}
.d-move{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px;padding-top:12px;border-top:1px solid var(--rule)}
.d-move button{border:1px solid var(--rule-2);border-radius:999px;padding:5px 12px;
  font-size:11.5px;font-weight:600;color:var(--ink-2)}
.d-move button:hover{border-color:var(--ink-3);color:var(--ink)}
.d-move button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.d-move .del{margin-left:auto;border-color:transparent;color:var(--ink-3)}
.d-move .del:hover{color:#A8372A;border-color:#A8372A}

.add{display:flex;gap:7px;max-width:500px;margin:14px auto 0}
#new{flex:1;min-width:0;background:transparent;border:0;border-bottom:1px solid var(--rule-2);
  padding:7px 2px;font-family:var(--f-display);font-size:15px}
#new::placeholder{color:var(--ink-3);font-style:italic}
#new:focus{outline:none;border-bottom-color:var(--current)}
#new-tier{background:transparent;border:1px solid var(--rule-2);border-radius:999px;
  padding:5px 9px;font-size:11.5px;color:var(--ink-2)}
.add .go{border:1px solid var(--rule-2);border-radius:999px;padding:0 15px;font-size:11.5px;font-weight:600}
.add .go:hover{background:var(--ink);border-color:var(--ink);color:var(--paper)}

.hint{text-align:center;font-family:var(--f-display);font-style:italic;
  font-size:12.5px;color:var(--ink-3);margin:12px 0 0}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
@media(max-width:560px){h1{font-size:22px}.seg button{padding:6px 12px;font-size:11.5px}}
</style>

    return lines;
  }

  // Labels are one or two words, so a bubble is its tier's size unless the
  // words genuinely need more room.
  function shape(item) {
    var t = tierOf(item.tier);
    var font = '500 ' + t.fs + 'px "Spectral", Georgia, serif';
    var one = width(item.label, font);
    var lines = one / 2 > t.r * 1.25 ? wrapAt(item.label, font, t.r * 1.3) : [item.label];
    if (lines.length === 1 && one > t.r * 1.55) lines = wrapAt(item.label, font, t.r * 1.1);
    var w = 0;
    for (var i = 0; i < lines.length; i++) w = Math.max(w, width(lines[i], font));
    var h = lines.length * t.lh;
    var need = Math.sqrt((w / 2) * (w / 2) + (h / 2) * (h / 2)) + 8;
    return { r: Math.max(t.r, need), lines: lines, t: t };
  }

  function narrow() { return window.innerWidth < 720; }
  function aspect() {
    if (narrow()) return [0.66, 1.45];
    return [1.52, 0.70];
  }

  function pack(circles) {
    var ratio = aspect(), placed = [], byId = {};
    circles.forEach(function (c, i) {
      if (i === 0) { c.x = 0; c.y = 0; placed.push(c); byId[c.id] = c; return; }
      var anchor = (c.serves && byId[c.serves]) || null;
      var ax = anchor ? anchor.x : 0, ay = anchor ? anchor.y : 0;
      var found = false;
      // A tied item hangs below its concept. Try a narrow cone straight down
      // first and only widen if that whole column is blocked — fanning wide at
      // close range would put it level with its concept, which reads as
      // "beside" rather than "under".
      var spans = anchor ? [Math.PI / 2.4, Math.PI / 2, Math.PI] : [null];
      for (var si = 0; si < spans.length && !found; si++) {
      var span = spans[si];
      for (var d = 4; d < 3000 && !found; d += 5) {
        var step = Math.PI / Math.max(10, Math.min(90, d / 3));

        var angles = [];
        if (anchor) {
          angles.push(Math.PI / 2);
          for (var k = 1; k * step <= span + 1e-9; k++) {
            angles.push(Math.PI / 2 - k * step);
            angles.push(Math.PI / 2 + k * step);
          }
        } else {
          for (var a0 = 0; a0 < Math.PI * 2 - 1e-9; a0 += step) angles.push(a0);
        }

        for (var ai = 0; ai < angles.length; ai++) {
          var a = angles[ai];
          // The composition is flattened, which squashes "down" into "beside".
          // A tied item ignores that and hangs on a true circle from its
          // concept, so the stack reads vertically.
          var rx = anchor ? 1 : ratio[0], ry = anchor ? 1 : ratio[1];
          var x = ax + Math.cos(a) * d * rx, y = ay + Math.sin(a) * d * ry, ok = true;
          for (var k = 0; k < placed.length; k++) {
            var p = placed[k], dx = p.x - x, dy = p.y - y;
            var need = (p.rOut || p.r) + (c.rOut || c.r) + 5;
            if (dx * dx + dy * dy < need * need) { ok = false; break; }
          }
          if (ok && anchor) {
            var pdx = anchor.x - x, pdy = anchor.y - y;
            var want = anchor.r + c.r + 16;
            if (pdx * pdx + pdy * pdy < want * want) ok = false;
          }
          if (ok) { c.x = x; c.y = y; found = true; break; }
        }
      }
      }
      if (!found) { c.x = ax; c.y = ay; }
      placed.push(c);
      byId[c.id] = c;
    });
  }

  /* ---------- render ---------- */

  var KEY_FONT = '400 10.5px "Public Sans", system-ui, sans-serif';
  var KEY_W = 152, KEY_GAP = 24, KEY_LH = 12, KEY_SPACE = 7;

  function renderField() {
    var field = document.getElementById("field");
    var list = document.getElementById("keylist");
    if (!state.items.length) {
      field.innerHTML = '<p class="hint">Nothing here yet. Add the first thing below.</p>';
      list.className = "keylist";
      list.innerHTML = "";
      return;
    }

    // Packing runs from the centre outward, so order decides where a thing
    // lands. Each concept is followed immediately by the work that serves it,
    // which puts the two next to each other and keeps the tie line short.
    var used = {}, order = [];
    state.items.forEach(function (it) {
      if (it.tier !== "deep" || used[it.id]) return;
      order.push(it); used[it.id] = 1;
      state.items.forEach(function (c) {
        if (!used[c.id] && c.serves === it.id) { order.push(c); used[c.id] = 1; }
      });
    });
    state.items.forEach(function (it) { if (!used[it.id]) { order.push(it); used[it.id] = 1; } });

    var circles = order.map(function (it) {
      var s = shape(it);
      return { id: it.id, tier: it.tier, name: it.name, label: it.label,
        serves: it.serves, pct: it.pct, r: s.r,
        rOut: s.r + (it.pct > 0 ? 7 : 0), lines: s.lines, t: s.t };
    });
    pack(circles);

    var minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
    circles.forEach(function (c) {
      var e = c.rOut || c.r;
      minX = Math.min(minX, c.x - e); maxX = Math.max(maxX, c.x + e);
      minY = Math.min(minY, c.y - e); maxY = Math.max(maxY, c.y + e);
    });

    // ties are drawn first so they pass behind the circles
    var byId = {};
    circles.forEach(function (c) { byId[c.id] = c; });
    var ties = circles.map(function (c) {
      var p = c.serves && byId[c.serves];
      if (!p) return "";
      var dx = p.x - c.x, dy = p.y - c.y, len = Math.sqrt(dx * dx + dy * dy) || 1;
      var ex = dx / len, ey = dy / len;
      return '<line class="tie g-' + c.t.side + '" x1="' + (c.x + ex * c.r).toFixed(1) +
        '" y1="' + (c.y + ey * c.r).toFixed(1) + '" x2="' + (p.x - ex * p.r).toFixed(1) +
        '" y2="' + (p.y - ey * p.r).toFixed(1) + '"/>';
    }).join("");

    var bubbles = circles.map(function (c) {
      var tspans = c.lines.map(function (line, i) {
        var y = c.y + (i - (c.lines.length - 1) / 2) * c.t.lh;
        return '<tspan x="' + c.x.toFixed(1) + '" y="' + y.toFixed(1) + '">' + esc(line) + "</tspan>";
      }).join("");
      return '<g class="bubble b-' + c.tier + " g-" + c.t.side + (selected === c.id ? " sel" : "") +
          '" data-id="' + esc(c.id) + '" tabindex="0" role="button" aria-label="' +
          esc(c.label + (c.name && c.name !== c.label ? " — " + c.name : "")) + '">' +
        '<circle cx="' + c.x.toFixed(1) + '" cy="' + c.y.toFixed(1) + '" r="' + c.r.toFixed(1) + '"/>' +
        ring(c) +
        '<text text-anchor="middle" dominant-baseline="central" font-size="' + c.t.fs + '">' +
          tspans + "</text></g>";
    }).join("");

    // The key rings the outside: only for bubbles whose full phrase says more
    // than the one or two words on the bubble itself.
    var keyed = circles.filter(function (c) { return c.name && c.name !== c.label; });
    var keyMarkup = "", padX = 0, keyMinY = Infinity, keyMaxY = -Infinity;

    if (!narrow() && keyed.length) {
      var mid = (minX + maxX) / 2;
      var sides = { left: [], right: [] };
      keyed.forEach(function (c) { sides[c.x < mid ? "left" : "right"].push(c); });

      ["left", "right"].forEach(function (side) {
        var col = sides[side].sort(function (a, b) { return a.y - b.y; });
        var blocks = col.map(function (c) {
          return { c: c, lines: wrapAt(c.name, KEY_FONT, KEY_W) };
        });
        var total = blocks.reduce(function (s, b) { return s + b.lines.length * KEY_LH + KEY_SPACE; }, 0);
        var y = (minY + maxY) / 2 - total / 2;
        var anchorX = side === "left" ? minX - KEY_GAP : maxX + KEY_GAP;

        blocks.forEach(function (b) {
          var h = b.lines.length * KEY_LH;
          var cy = y + h / 2;
          keyMinY = Math.min(keyMinY, y);
          keyMaxY = Math.max(keyMaxY, y + h);

          // leader: a short stub off the text, then a straight run to the rim
          var dx = b.c.x - anchorX, dy = b.c.y - cy, len = Math.sqrt(dx * dx + dy * dy) || 1;
          var rimX = b.c.x - (dx / len) * b.c.r, rimY = b.c.y - (dy / len) * b.c.r;
          var stub = side === "left" ? anchorX + 7 : anchorX - 7;

          var hitX = side === "left" ? anchorX - 11 - KEY_W : anchorX + 11;
          keyMarkup += '<g class="keyrow g-' + b.c.t.side + (selected === b.c.id ? " sel-key" : "") +
              '" data-id="' + esc(b.c.id) + '" role="button" tabindex="0" aria-label="' +
              esc(b.c.label + " — " + b.c.name) + '">' +
            '<rect class="hit" x="' + hitX.toFixed(1) + '" y="' + (y - 3).toFixed(1) +
              '" width="' + (KEY_W + 11) + '" height="' + (h + 6).toFixed(1) + '"/>' +
            '<path class="lead" d="M' + anchorX.toFixed(1) + " " + cy.toFixed(1) +
              "L" + stub.toFixed(1) + " " + cy.toFixed(1) +
              "L" + rimX.toFixed(1) + " " + rimY.toFixed(1) + '"/>' +
            '<circle class="keydot" cx="' + rimX.toFixed(1) + '" cy="' + rimY.toFixed(1) +
              '" r="2" fill="var(--' + b.c.tier + ')"/>' +
            '<text class="keytext" text-anchor="' + (side === "left" ? "end" : "start") + '">' +
              b.lines.map(function (line, i) {
                return '<tspan x="' + (side === "left" ? anchorX - 11 : anchorX + 11).toFixed(1) +
                  '" y="' + (y + i * KEY_LH + KEY_LH * 0.78).toFixed(1) + '">' + esc(line) + "</tspan>";
              }).join("") +
            "</text></g>";
          y += h + KEY_SPACE;
        });
      });
      padX = KEY_GAP + KEY_W + 16;
      minY = Math.min(minY, keyMinY - 6);
      maxY = Math.max(maxY, keyMaxY + 6);
      list.className = "keylist";
      list.innerHTML = "";
    } else {
      list.className = "keylist" + (keyed.length ? " on" : "");
      list.innerHTML = keyed.map(function (c) {
        return "<div><i style=\"background:color-mix(in srgb,var(--" + c.tier +
          ") 30%,transparent);border-color:var(--" + c.tier + ")\"></i><b>" +
          esc(c.label) + "</b> &nbsp;" + esc(c.name) + "</div>";
      }).join("");
    }

    var m = 14;
    field.innerHTML = '<svg class="mode-' + mode + '" viewBox="' +
      (minX - padX - m).toFixed(1) + " " + (minY - m).toFixed(1) + " " +
      (maxX - minX + padX * 2 + m * 2).toFixed(1) + " " + (maxY - minY + m * 2).toFixed(1) +
      '" role="img" aria-label="Everything I carry and everything I bless">' +
      ties + keyMarkup + bubbles + "</svg>";
  }

  // Progress as an arc around the rim, opening clockwise from the top.
  function ring(c) {
    if (!c.pct) return "";
    var rr = c.r + 4, circ = 2 * Math.PI * rr;
    return '<circle class="ring" cx="' + c.x.toFixed(1) + '" cy="' + c.y.toFixed(1) +
      '" r="' + rr.toFixed(1) + '" stroke-dasharray="' + (circ * c.pct / 100).toFixed(1) +
      " " + circ.toFixed(1) + '" transform="rotate(-90 ' + c.x.toFixed(1) + " " +
      c.y.toFixed(1) + ')"><title>' + c.pct + '% along</title></circle>';
  }

  function renderLegend() {
    document.getElementById("legend").innerHTML = TIERS.map(function (t) {
      var n = state.items.filter(function (i) { return i.tier === t.key; }).length;
      return '<span><span class="key k-' + t.key + '"></span><b>' + esc(t.name) + "</b> " + n + "</span>";
    }).join("");
  }

  function autosize(el) { el.style.height = "auto"; el.style.height = el.scrollHeight + "px"; }

  function renderDetail() {
    var box = document.getElementById("detail");
    var it = selected !== null ? state.items[indexOf(selected)] : null;
    if (!it) { box.hidden = true; box.innerHTML = ""; return; }
    box.hidden = false;
    box.innerHTML =
      '<div class="d-tier" style="color:var(--' + it.tier + ')">' + esc(tierOf(it.tier).name) +
        ' &nbsp;·&nbsp; <span style="color:var(--ink-3)">' + esc(tierOf(it.tier).blurb) + "</span></div>" +
      '<span class="d-lab">On the bubble</span>' +
      '<textarea class="d-label" rows="1" aria-label="Short label">' + esc(it.label) + "</textarea>" +
      '<span class="d-lab">In the key</span>' +
      '<textarea class="d-name" rows="1" placeholder="the fuller phrase" aria-label="Full name">' +
        esc(it.name) + "</textarea>" +
      '<span class="d-lab">Note</span>' +
      '<textarea class="d-note" rows="1" placeholder="a note, if it helps" aria-label="Note">' +
        esc(it.note) + "</textarea>" +
      '<span class="d-lab">Serves</span>' +
      '<select class="d-serves" aria-label="Which deeper thing this serves">' +
        '<option value=""' + (it.serves ? "" : " selected") + ">— on its own —</option>" +
        state.items.filter(function (d) { return d.tier === "deep" && d.id !== it.id; })
          .map(function (d) {
            return '<option value="' + esc(d.id) + '"' + (d.id === it.serves ? " selected" : "") +
              ">" + esc(d.label) + "</option>";
          }).join("") +
      "</select>" +
      (function () {
        var peers = state.items.filter(function (x) { return x.tier === it.tier; });
        var pos = peers.indexOf(it) + 1;
        var suffix = pos === 1 ? "st" : pos === 2 ? "nd" : pos === 3 ? "rd" : "th";
        if (pos > 10 && pos < 14) suffix = "th";
        return '<span class="d-lab">Priority</span>' +
          '<div class="d-rank">' +
            '<button data-mv="-1"' + (pos === 1 ? " disabled" : "") +
              ' aria-label="Higher priority" title="Higher priority">&#9650;</button>' +
            '<button data-mv="1"' + (pos === peers.length ? " disabled" : "") +
              ' aria-label="Lower priority" title="Lower priority">&#9660;</button>' +
            "<b>" + pos + suffix + " of " + peers.length + " in " + esc(tierOf(it.tier).name) +
            '</b><span class="d-rank-why">higher sits nearer the centre</span>' +
          "</div>";
      })() +
      '<span class="d-lab">How far along</span>' +
      '<div class="d-pct"><input class="d-range" type="range" min="0" max="100" step="5" value="' +
        it.pct + '" aria-label="Percent complete"><b>' +
        (it.pct ? it.pct + "%" : "—") + "</b></div>" +
      '<div class="d-move">' +
        TIERS.map(function (t) {
          return '<button data-tier="' + t.key + '" aria-pressed="' + (t.key === it.tier) + '">' +
            esc(t.name) + "</button>";
        }).join("") +
        '<button class="del" data-del="1">Remove</button>' +
      "</div>";
    box.querySelectorAll("textarea").forEach(autosize);
  }

  function render() { renderField(); renderLegend(); renderDetail(); }

  /* ---------- actions ---------- */

  function setMode(next) {
    mode = next;
    document.querySelectorAll("[data-mode]").forEach(function (b) {
      b.setAttribute("aria-pressed", String(b.dataset.mode === next));
    });
    var svg = document.querySelector("#field svg");
    if (svg) svg.setAttribute("class", "mode-" + next);
  }

  function select(id) {
    selected = selected === id ? null : id;
    render();
    if (selected) document.getElementById("detail").scrollIntoView({ block: "nearest" });
  }

  function placeAt(tier) {
    var at = 0;
    while (at < state.items.length && rank(state.items[at].tier) <= rank(tier)) at++;
    return at;
  }

  // Order inside a tier is the priority order, and packing consumes it from the
  // centre out — so moving something up literally moves it toward the middle.
  function movePriority(id, dir) {
    var i = indexOf(id);
    if (i < 0) return;
    var it = state.items[i];
    var peers = state.items.filter(function (x) { return x.tier === it.tier; });
    var pos = peers.indexOf(it);
    if (pos + dir < 0 || pos + dir >= peers.length) return;
    var j = indexOf(peers[pos + dir].id);
    state.items[i] = state.items[j];
    state.items[j] = it;
    save(); render();
  }

  function moveTo(id, tier) {
    var i = indexOf(id);
    if (i < 0 || state.items[i].tier === tier) return;
    var it = state.items[i];
    it.tier = tier;
    state.items.splice(i, 1);
    state.items.splice(placeAt(tier), 0, it);
    save(); render();
  }

  function add() {
    var input = document.getElementById("new");
    var name = input.value.trim();
    if (!name) { input.focus(); return; }
    var tier = document.getElementById("new-tier").value;
    var it = { id: uid(), label: shorten(name), name: name, note: "", tier: tier,
      serves: "", pct: 0 };
    state.items.splice(placeAt(tier), 0, it);
    input.value = "";
    selected = it.id;
    save(); render();
    input.focus();
  }

  /* ---------- wiring ---------- */

  var sel = document.getElementById("new-tier");
  TIERS.forEach(function (t) {
    var o = document.createElement("option");
    o.value = t.key; o.textContent = t.name;
    sel.appendChild(o);
  });
  sel.value = "current";

  document.querySelectorAll("[data-mode]").forEach(function (b) {
    b.addEventListener("click", function () { setMode(b.dataset.mode); });
  });

  var field = document.getElementById("field");
  field.addEventListener("click", function (ev) {
    var g = ev.target.closest(".bubble, .keyrow");
    if (g) select(g.dataset.id);
  });
  field.addEventListener("keydown", function (ev) {
    if (ev.key !== "Enter" && ev.key !== " ") return;
    var g = ev.target.closest(".bubble, .keyrow");
    if (g) { ev.preventDefault(); select(g.dataset.id); }
  });

  var detail = document.getElementById("detail");
  detail.addEventListener("click", function (ev) {
    var mv = ev.target.closest("[data-mv]");
    if (mv) { movePriority(selected, parseInt(mv.dataset.mv, 10)); return; }
    var t = ev.target.closest("[data-tier]");
    if (t) { moveTo(selected, t.dataset.tier); return; }
    if (ev.target.closest("[data-del]")) {
      var i = indexOf(selected);
      if (i >= 0) state.items.splice(i, 1);
      selected = null;
      save(); render();
    }
  });
  detail.addEventListener("input", function (ev) {
    if (ev.target.tagName === "TEXTAREA") { autosize(ev.target); return; }
    // Track the slider live, but only redraw the field once it is let go.
    if (ev.target.classList.contains("d-range")) {
      var v = parseInt(ev.target.value, 10) || 0;
      var out = detail.querySelector(".d-pct b");
      if (out) out.textContent = v ? v + "%" : "—";
    }
  });
  detail.addEventListener("change", function (ev) {
    var it = state.items[indexOf(selected)];
    if (!it) return;
    var el = ev.target;
    if (el.classList.contains("d-label")) {
      var v = el.value.trim();
      if (!v) { el.value = it.label; return; }
      it.label = v.slice(0, 40);
    } else if (el.classList.contains("d-name")) {
      it.name = el.value.trim().slice(0, 300);
    } else if (el.classList.contains("d-note")) {
      it.note = el.value.trim().slice(0, 500);
    } else if (el.classList.contains("d-serves")) {
      it.serves = el.value;
    } else if (el.classList.contains("d-range")) {
      it.pct = Math.max(0, Math.min(100, parseInt(el.value, 10) || 0));
    } else return;
    save(); render();
  });

  document.getElementById("add").addEventListener("click", add);
  document.getElementById("new").addEventListener("keydown", function (ev) {
    if (ev.key === "Enter") add();
  });
  document.addEventListener("keydown", function (ev) {
    if (ev.key === "Escape" && selected) { selected = null; render(); }
  });

  render();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(renderField);
  var last = window.innerWidth;
  window.addEventListener("resize", function () {
    if (Math.abs(window.innerWidth - last) < 60) return;
    last = window.innerWidth;
    renderField();
  });
})();
</script>

<script>
/* Offline support for the hosted copy. Skipped inside a frame (where a published
   artifact runs and no sw.js exists) and on file:// URLs. */
(function () {
  "use strict";
  var framed = true;
  try { framed = window.top !== window.self; } catch (err) { framed = true; }
  if (framed || !("serviceWorker" in navigator)) return;
  if (location.protocol !== "https:" && location.hostname !== "localhost" && location.hostname !== "127.0.0.1") return;
  var hadController = !!navigator.serviceWorker.controller;
  var reloading = false;
  navigator.serviceWorker.addEventListener("controllerchange", function () {
    if (!hadController || reloading) return;
    reloading = true;
    location.reload();
  });
  window.addEventListener("load", function () {
    navigator.serviceWorker.register("sw.js").catch(function () {});
  });
})();
</script>
