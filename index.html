<meta charset="utf-8">
<title>Building &amp; Blessing</title>
<meta name="description" content="What I am responsible for, and what I am only blessing.">
<meta name="theme-color" content="#F4F3EF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#101311" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Stewardship">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600&family=Spectral:ital,wght@0,400;0,500;0,600;1,400&display=swap">

<style>
:root{
  --paper:#F4F3EF;
  --ink:#1B1E1C;
  --ink-2:#535B57;
  --ink-3:#8C948F;
  --rule:#E4E3DC;
  --rule-2:#CFCEC4;
  --carry:#1E5B4E;
  --light:#94682E;
  --f-display:"Spectral", Georgia, "Times New Roman", serif;
  --f-ui:"Public Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#101311; --ink:#E9EAE4; --ink-2:#A9B1AC; --ink-3:#7C847F;
    --rule:#222722; --rule-2:#343B35; --carry:#5FBBA3; --light:#D2A15E;
  }
}
:root[data-theme="dark"]{
  --paper:#101311; --ink:#E9EAE4; --ink-2:#A9B1AC; --ink-3:#7C847F;
  --rule:#222722; --rule-2:#343B35; --carry:#5FBBA3; --light:#D2A15E;
}

*{box-sizing:border-box}
body{
  background:var(--paper);color:var(--ink);
  font-family:var(--f-ui);font-size:15px;line-height:1.5;
  -webkit-font-smoothing:antialiased;
  padding:0 22px 120px;
}
.wrap{max-width:620px;margin:0 auto}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,select{font:inherit;color:inherit}
:focus-visible{outline:1.5px solid var(--carry);outline-offset:3px;border-radius:2px}

/* ---------- masthead ---------- */
header{padding:52px 0 20px;border-bottom:1px solid var(--rule-2);margin-bottom:26px}
h1{
  font-family:var(--f-display);font-size:31px;font-weight:600;
  margin:0;letter-spacing:-.02em;line-height:1.15;
}
h1 .amp{font-style:italic;font-weight:400;color:var(--ink-3);padding:0 .04em}
.sub{
  font-family:var(--f-display);font-style:italic;font-size:15px;
  color:var(--ink-2);margin:7px 0 0;
}

/* ---------- add ---------- */
.add{display:flex;gap:7px;margin-bottom:38px}
#new{
  flex:1;min-width:0;background:transparent;
  border:0;border-bottom:1px solid var(--rule-2);border-radius:0;
  padding:8px 2px;font-family:var(--f-display);font-size:16.5px;
}
#new::placeholder{color:var(--ink-3);font-style:italic}
#new:focus{outline:none;border-bottom-color:var(--carry)}
#new-tier{
  background:transparent;border:1px solid var(--rule-2);border-radius:3px;
  padding:6px 8px;font-size:12.5px;color:var(--ink-2);
}
.add button{
  border:1px solid var(--rule-2);border-radius:3px;
  padding:0 15px;font-size:12.5px;font-weight:600;letter-spacing:.02em;
}
.add button:hover{background:var(--ink);border-color:var(--ink);color:var(--paper)}

/* ---------- tiers ---------- */
.tier{margin-bottom:34px}
.tier-head{
  display:flex;align-items:baseline;justify-content:space-between;gap:14px;
  padding-bottom:6px;border-bottom:1px solid var(--rule-2);
}
.tier-name{font-size:11.5px;font-weight:600;letter-spacing:.15em;text-transform:uppercase}
.g-carry .tier-name{color:var(--carry)}
.g-other .tier-name{color:var(--light)}
.tier-count{font-size:11.5px;color:var(--ink-3);font-variant-numeric:tabular-nums;flex:none}
.tier-note{
  font-family:var(--f-display);font-style:italic;font-size:14px;
  color:var(--ink-2);margin:9px 0 3px;
}

/* ---------- items ---------- */
.item{
  display:grid;grid-template-columns:32px minmax(0,1fr) auto;
  align-items:start;column-gap:10px;
  padding:8px 0;border-bottom:1px solid var(--rule);
}
.item:last-child{border-bottom:0}
.gutter{
  font-size:12.5px;font-weight:500;color:var(--ink-3);
  font-variant-numeric:tabular-nums;text-align:right;
  padding-top:5px;
}
.mark{display:inline-block;width:6px;height:6px;margin-right:1px}
.m-blessing{border:1.5px solid var(--light)}
.m-joy{border-radius:50%;background:var(--light)}
.m-future{border-radius:50%;border:1.5px dotted var(--light)}

.name,.note{
  display:block;width:100%;background:none;border:0;
  resize:none;overflow:hidden;
}
.name{
  padding:2px 0;
  font-family:var(--f-display);font-size:18px;font-weight:400;line-height:1.35;
}
.g-other .name{color:var(--ink-2)}
.name:focus{outline:none;box-shadow:inset 0 -1px 0 var(--rule-2)}
.note{
  grid-column:2;padding:1px 0 3px;
  font-family:var(--f-display);font-style:italic;font-size:14px;
  color:var(--ink-2);line-height:1.45;
}
.note:focus{outline:none;box-shadow:inset 0 -1px 0 var(--rule-2)}
.note::placeholder{color:var(--ink-3)}
/* Notes appear on explicit intent only. Revealing them on hover or focus
   changed row height, which shifted the rows below out from under the
   pointer and made the next click land on the wrong item. */

.tools{grid-row:1;grid-column:3;display:flex;gap:2px;opacity:0;transition:opacity .14s ease}
.item:hover .tools,.item:focus-within .tools{opacity:1}
@media (hover:none){.tools{opacity:.5}}
.tools button{
  width:26px;height:26px;border-radius:3px;color:var(--ink-3);
  font-size:11px;line-height:1;
}
.tools button:hover{color:var(--ink)}
.tools button:disabled{opacity:.2;cursor:default}
.tools .del:hover{color:#A8372A}

/* ---------- divider ---------- */
.divide{display:flex;align-items:center;gap:15px;margin:44px 0 34px}
.divide::before,.divide::after{content:"";flex:1;height:1px;background:var(--rule-2)}
.divide span{
  font-size:10.5px;font-weight:600;letter-spacing:.15em;text-transform:uppercase;
  color:var(--ink-3);white-space:nowrap;
}

.empty-tier{
  font-family:var(--f-display);font-style:italic;font-size:14px;
  color:var(--ink-3);padding:9px 0 3px;
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
@media(max-width:520px){
  h1{font-size:26px}
  .add{flex-wrap:wrap}
  #new{flex:1 0 100%}
  .item{grid-template-columns:26px minmax(0,1fr) auto;column-gap:8px}
  .name{font-size:17px}
}
</style>

<div class="wrap">
  <header>
    <h1>Building <span class="amp">&amp;</span> Blessing</h1>
    <p class="sub">What I am responsible for, and what I am only blessing.</p>
  </header>

  <div class="add">
    <input id="new" type="text" placeholder="Add something…" aria-label="Name of the thing to add">
    <select id="new-tier" aria-label="Which tier to add it to"></select>
    <button id="add">Add</button>
  </div>

  <main id="view"></main>
</div>

<script id="state" type="application/json">{"v":3,"items":null}</script>

<script>
(function () {
  "use strict";

  var PRISTINE = "<!doctype html>\n" + document.documentElement.outerHTML;
  var STORE_KEY = "building-and-blessing/v3";

  // Order here is the priority order of the whole page. Everything in "carry"
  // is numbered in one run; the rest are listed, not ranked.
  var TIERS = [
    { key: "deep",     name: "Deep",      group: "carry",
      note: "Formation. These do not finish, and nobody else can do them for me." },
    { key: "current",  name: "Current",   group: "carry",
      note: "Live responsibilities with edges. Real, but not the deep work." },
    { key: "blessing", name: "Blessing",  group: "other",
      note: "I back it. Someone else owns it." },
    { key: "joy",      name: "Enjoyment", group: "other",
      note: "For gladness. No other reason needed." },
    { key: "future",   name: "Future",    group: "other",
      note: "Not mine yet. The work now is preparing." }
  ];

  function rank(key) {
    for (var i = 0; i < TIERS.length; i++) if (TIERS[i].key === key) return i;
    return 1;
  }
  function tierOf(key) { return TIERS[rank(key)]; }

  /* ---------- state ---------- */

  function uid() { return "i" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }

  function normalize(raw) {
    if (!raw) return null;
    var src = Array.isArray(raw.items) ? raw.items : (Array.isArray(raw.entries) ? raw.entries : null);
    if (!src) return null;
    var known = TIERS.map(function (t) { return t.key; });
    var items = src.map(function (e) {
      e = e || {};
      var tier = e.tier;
      if (known.indexOf(tier) < 0) {
        // v1 posture / v2 list names land on the nearest tier.
        if (e.tier === "bless" || e.list === "bless" || e.posture === "blessing") tier = "blessing";
        else tier = "current";
      }
      return {
        id: e.id || uid(),
        name: String(e.name || "").slice(0, 300),
        note: String(e.note || "").slice(0, 500),
        tier: tier
      };
    });
    // The array is always grouped in tier order; sort stably to guarantee it.
    var saved = typeof raw.t === "number" ? raw.t : 0;
    return { v: 3, t: saved, items: items.map(function (it, i) { return [it, i]; })
      .sort(function (a, b) { return (rank(a[0].tier) - rank(b[0].tier)) || (a[1] - b[1]); })
      .map(function (p) { return p[0]; }) };
  }

  function load() {
    var embedded = null, local = null;
    try {
      embedded = normalize(JSON.parse(document.getElementById("state").textContent || "{}"));
    } catch (err) { embedded = null; }
    try {
      var stored = localStorage.getItem(STORE_KEY)
        || localStorage.getItem("building-and-blessing/v2")
        || localStorage.getItem("building-and-blessing/v1");
      if (stored) local = normalize(JSON.parse(stored));
    } catch (err) { local = null; }

    // Publishing is debounced, so a page closed straight after an edit has the
    // change in localStorage but not yet in the published copy. Take whichever
    // was written last rather than always trusting the embedded one.
    if (embedded && local) return (local.t || 0) > (embedded.t || 0) ? local : embedded;
    return embedded || local || { v: 3, t: 0, items: [] };
  }

  var state = load();

  /* ---------- persistence ---------- */

  var api = null;
  if (window.claude && typeof window.claude.use === "function") {
    Promise.resolve(window.claude.use("artifact")).then(function (a) { api = a || null; })
      .catch(function () { api = null; });
  }

  var STATE_OPEN = '<script id="state" type="application/' + 'json">';
  var STATE_CLOSE = "<" + "/script>";

  function buildDocument() {
    var start = PRISTINE.indexOf(STATE_OPEN);
    if (start < 0) return PRISTINE;
    var from = start + STATE_OPEN.length;
    var end = PRISTINE.indexOf(STATE_CLOSE, from);
    if (end < 0) return PRISTINE;
    return PRISTINE.slice(0, from) + JSON.stringify(state).replace(/</g, "\\u003c") + PRISTINE.slice(end);
  }

  var timer = null;
  function save() {
    state.t = Date.now();
    try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (err) { /* private mode */ }
    if (timer) clearTimeout(timer);
    timer = setTimeout(function () {
      if (!api) return;
      try {
        Promise.resolve(api.publish(buildDocument())).catch(function () { /* someone published first */ });
      } catch (err) { /* best effort */ }
    }, 800);
  }

  /* ---------- helpers ---------- */

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function indexOf(id) {
    for (var i = 0; i < state.items.length; i++) if (state.items[i].id === id) return i;
    return -1;
  }
  function inTier(key) {
    return state.items.filter(function (i) { return i.tier === key; });
  }
  // Where a member of `key` belongs, given the array stays grouped in tier order.
  function boundary(key, where) {
    var r = rank(key), start = 0;
    while (start < state.items.length && rank(state.items[start].tier) < r) start++;
    var end = start;
    while (end < state.items.length && rank(state.items[end].tier) === r) end++;
    return where === "start" ? start : end;
  }

  /* ---------- actions ---------- */

  function add() {
    var input = document.getElementById("new");
    var name = input.value.trim();
    if (!name) { input.focus(); return; }
    var tier = document.getElementById("new-tier").value;
    state.items.splice(boundary(tier, "end"), 0, { id: uid(), name: name, note: "", tier: tier });
    input.value = "";
    input.focus();
    save(); render();
  }

  // One control does both jobs: reorder inside a tier, and at a tier's edge,
  // carry the item across into the neighbouring tier. The page is one stack.
  function move(id, dir) {
    var i = indexOf(id);
    if (i < 0) return;
    var it = state.items[i];
    var siblings = inTier(it.tier);
    var pos = siblings.indexOf(it);

    if (dir === -1 ? pos > 0 : pos < siblings.length - 1) {
      var j = indexOf(siblings[pos + dir].id);
      state.items[i] = state.items[j];
      state.items[j] = it;
    } else {
      var next = TIERS[rank(it.tier) + dir];
      if (!next) return;
      state.items.splice(i, 1);
      it.tier = next.key;
      state.items.splice(boundary(next.key, dir === -1 ? "end" : "start"), 0, it);
    }
    save(); render(id, dir);
  }

  function remove(id) {
    var i = indexOf(id);
    if (i < 0) return;
    state.items.splice(i, 1);
    save(); render();
  }

  function edit(id, field, value) {
    var it = state.items[indexOf(id)];
    if (!it) return;
    value = value.trim();
    if (it[field] === value) return;
    if (field === "name" && !value) return;
    it[field] = value.slice(0, field === "name" ? 300 : 500);
    save();
  }

  /* ---------- render ---------- */

  function itemHTML(it, tier, gutter, first, last) {
    return '<div class="item" data-id="' + esc(it.id) + '">' +
      '<div class="gutter">' + gutter + "</div>" +
      '<textarea class="name" rows="1" aria-label="Name">' + esc(it.name) + "</textarea>" +
      '<div class="tools">' +
        '<button data-act="up" ' + (first ? "disabled" : "") +
          ' aria-label="Move up" title="Move up">&#9650;</button>' +
        '<button data-act="down" ' + (last ? "disabled" : "") +
          ' aria-label="Move down" title="Move down">&#9660;</button>' +
        (it.note || noteOpen === it.id ? "" :
          '<button data-act="note" aria-label="Add a note" title="Add a note">&#9998;</button>') +
        '<button data-act="del" class="del" aria-label="Remove" title="Remove">&#10005;</button>' +
      "</div>" +
      (it.note || noteOpen === it.id
        ? '<textarea class="note" rows="1" placeholder="a note, if it helps" aria-label="Note">' +
          esc(it.note) + "</textarea>"
        : "") +
    "</div>";
  }

  var noteOpen = null;

  // A textarea does not size itself; without this, long notes would be clipped.
  function autosize(el) {
    el.style.height = "auto";
    el.style.height = el.scrollHeight + "px";
  }

  function render(focusId, focusDir) {
    var html = "", counter = 0, total = state.items.length, seen = 0, dividerDone = false;

    TIERS.forEach(function (tier) {
      var items = inTier(tier.key);

      if (tier.group === "other" && !dividerDone) {
        dividerDone = true;
        html += '<div class="divide"><span>Not mine to carry</span></div>';
      }

      html += '<section class="tier g-' + tier.group + '">' +
        '<div class="tier-head"><span class="tier-name">' + esc(tier.name) + "</span>" +
        '<span class="tier-count">' + items.length + "</span></div>" +
        '<p class="tier-note">' + esc(tier.note) + "</p>";

      if (!items.length) {
        html += '<p class="empty-tier">Nothing here.</p>';
      } else {
        items.forEach(function (it) {
          var gutter = tier.group === "carry"
            ? ++counter
            : '<span class="mark m-' + tier.key + '"></span>';
          html += itemHTML(it, tier, gutter, seen === 0, seen === total - 1);
          seen++;
        });
      }
      html += "</section>";
    });

    document.getElementById("view").innerHTML = html;
    Array.prototype.forEach.call(document.querySelectorAll(".name,.note"), autosize);

    if (noteOpen) {
      var opened = document.querySelector('[data-id="' + noteOpen + '"] .note');
      if (opened) { opened.focus(); return; }
    }
    if (focusId) {
      var row = document.querySelector('[data-id="' + focusId + '"]');
      if (row) {
        var order = focusDir === -1 ? ["up", "down"] : ["down", "up"];
        var target = null;
        for (var k = 0; k < order.length && !target; k++) {
          var b = row.querySelector('[data-act="' + order[k] + '"]');
          if (b && !b.disabled) target = b;
        }
        (target || row.querySelector(".name")).focus();
      }
    }
  }

  /* ---------- wiring ---------- */

  var tierSelect = document.getElementById("new-tier");
  TIERS.forEach(function (t) {
    var o = document.createElement("option");
    o.value = t.key;
    o.textContent = t.name;
    tierSelect.appendChild(o);
  });
  tierSelect.value = "current";

  document.getElementById("add").addEventListener("click", add);
  document.getElementById("new").addEventListener("keydown", function (ev) {
    if (ev.key === "Enter") add();
  });

  var view = document.getElementById("view");
  view.addEventListener("click", function (ev) {
    var btn = ev.target.closest("[data-act]");
    if (!btn) return;
    var id = btn.closest("[data-id]").dataset.id;
    if (btn.dataset.act === "up") move(id, -1);
    else if (btn.dataset.act === "down") move(id, 1);
    else if (btn.dataset.act === "note") { noteOpen = id; render(); noteOpen = null; }
    else remove(id);
  });
  view.addEventListener("change", function (ev) {
    var el = ev.target;
    if (!el.classList.contains("name") && !el.classList.contains("note")) return;
    edit(el.closest("[data-id]").dataset.id, el.classList.contains("name") ? "name" : "note", el.value);
  });
  view.addEventListener("input", function (ev) {
    if (ev.target.classList.contains("name") || ev.target.classList.contains("note")) autosize(ev.target);
  });
  view.addEventListener("keydown", function (ev) {
    if (ev.key === "Enter" && (ev.target.classList.contains("name") || ev.target.classList.contains("note"))) {
      ev.target.blur();
    }
  });

  render();
})();
</script>

<script>
/* Offline support for the hosted copy. Skipped inside a frame (where a published
   artifact runs and no sw.js exists) and on file:// URLs. */
(function () {
  "use strict";
  var framed = true;
  try { framed = window.top !== window.self; } catch (err) { framed = true; }
  if (framed || !("serviceWorker" in navigator)) return;
  if (location.protocol !== "https:" && location.hostname !== "localhost" && location.hostname !== "127.0.0.1") return;

  var hadController = !!navigator.serviceWorker.controller;
  var reloading = false;
  navigator.serviceWorker.addEventListener("controllerchange", function () {
    if (!hadController || reloading) return;
    reloading = true;
    location.reload();
  });
  window.addEventListener("load", function () {
    navigator.serviceWorker.register("sw.js").catch(function () { /* bonus, not required */ });
  });
})();
</script>
