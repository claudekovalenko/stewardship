<meta charset="utf-8">
<title>Building &amp; Blessing</title>
<meta name="description" content="What I am responsible for, and what I am only blessing.">
<meta name="theme-color" content="#F0F2F0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0D1413" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Stewardship">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Public+Sans:wght@400;500;600&family=Spectral:ital,wght@0,400;0,500;0,600;1,400&display=swap">

<style>
:root{
  --paper:#F0F2F0;
  --surface:#FAFBFA;
  --ink:#14201D;
  --ink-2:#42544F;
  --ink-3:#73857F;
  --rule:#D2DAD5;
  --rule-strong:#B4C0BA;
  --mine:#0D6A57;
  --bless:#8F6410;
  --bless-soft:#EFE6CE;
  --f-display:"Spectral", Georgia, serif;
  --f-body:"Public Sans", system-ui, -apple-system, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0D1413; --surface:#151E1C; --ink:#E7EDEA; --ink-2:#A6B6B0; --ink-3:#788983;
    --rule:#263330; --rule-strong:#3A4A44; --mine:#57BCA0; --bless:#D8A94C; --bless-soft:#332711;
  }
}
:root[data-theme="dark"]{
  --paper:#0D1413; --surface:#151E1C; --ink:#E7EDEA; --ink-2:#A6B6B0; --ink-3:#788983;
  --rule:#263330; --rule-strong:#3A4A44; --mine:#57BCA0; --bless:#D8A94C; --bless-soft:#332711;
}

*{box-sizing:border-box}
body{
  background:var(--paper);color:var(--ink);
  font-family:var(--f-body);font-size:15px;line-height:1.5;
  -webkit-font-smoothing:antialiased;
  padding:0 20px 90px;
}
.wrap{max-width:640px;margin:0 auto}
button{font:inherit;color:inherit;cursor:pointer}
input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--mine);outline-offset:2px;border-radius:2px}

/* ---------- head ---------- */
header{padding:38px 0 22px}
h1{font-family:var(--f-display);font-size:26px;font-weight:600;margin:0;letter-spacing:-.015em}
h1 .amp{font-style:italic;font-weight:400;color:var(--ink-3)}
.sub{color:var(--ink-2);font-size:14px;margin:4px 0 0}

/* ---------- add ---------- */
.add{display:flex;gap:8px;margin-bottom:30px}
#new{
  flex:1;min-width:0;background:var(--surface);border:1px solid var(--rule-strong);
  border-radius:4px;padding:10px 12px;font-size:15px;
}
#new::placeholder{color:var(--ink-3)}
.add button{
  border:1px solid var(--rule-strong);background:var(--surface);border-radius:4px;
  padding:0 14px;font-size:13px;font-weight:500;white-space:nowrap;
}
.add button:hover{border-color:var(--ink-3)}
.add .primary{background:var(--ink);border-color:var(--ink);color:var(--paper)}

/* ---------- sections ---------- */
section{margin-bottom:8px}
.sec-head{display:flex;align-items:baseline;gap:10px;margin-bottom:10px}
.sec-head h2{
  font-family:var(--f-mono);font-size:11px;font-weight:500;letter-spacing:.16em;
  text-transform:uppercase;margin:0;
}
.sec-mine h2{color:var(--mine)}
.sec-bless h2{color:var(--bless)}
.sec-switch h2{color:var(--ink-2)}
.sec-head .n{font-family:var(--f-mono);font-size:11px;color:var(--ink-3)}
.sec-note{font-family:var(--f-display);font-style:italic;font-size:13.5px;color:var(--ink-2);margin:0 0 12px}

/* ---------- rows ---------- */
ol,ul{list-style:none;margin:0;padding:0}
.row{
  position:relative;display:flex;align-items:center;gap:10px;
  border:1px solid var(--rule);border-radius:4px;margin-bottom:6px;
  padding:2px 6px 2px 14px;background:var(--surface);
}
.row::before{content:"";position:absolute;left:0;top:-1px;bottom:-1px;width:3px;border-radius:4px 0 0 4px}
.row-mine::before{background:var(--mine)}
.row-bless::before{background:repeating-linear-gradient(180deg,var(--bless) 0 6px,transparent 6px 11px)}
.row-bless{background:transparent}
.row:focus-within{border-color:var(--rule-strong)}

.rank{
  font-family:var(--f-mono);font-size:12px;color:var(--ink-3);
  min-width:20px;text-align:right;font-variant-numeric:tabular-nums;flex:none;
}
.name{
  flex:1;min-width:0;background:none;border:0;padding:9px 0;
  font-family:var(--f-display);font-size:16.5px;font-weight:500;
}
.row-bless .name{font-weight:400}
.name:focus{outline:none;box-shadow:inset 0 -1px 0 var(--rule-strong)}

.tools{display:flex;gap:1px;flex:none}
.tools button{
  border:0;background:none;color:var(--ink-3);
  width:28px;height:28px;border-radius:3px;font-size:13px;line-height:1;
}
.tools button:hover{background:var(--paper);color:var(--ink)}
.tools button[disabled]{opacity:.25;cursor:default}
.tools button:hover.del{color:#A8372A}

/* ---------- the line ---------- */
.line{display:flex;align-items:center;gap:12px;margin:26px 0 14px}
.line::before,.line::after{content:"";height:1px;background:var(--rule-strong);flex:1}
.line span{
  font-family:var(--f-mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--ink-3);white-space:nowrap;
}

/* ---------- switching ---------- */
.sec-switch{
  border:1px dashed var(--rule-strong);border-radius:4px;
  padding:14px 16px;margin:26px 0;
}
.switch-row{display:flex;align-items:center;gap:10px;padding:5px 0}
.switch-row .name{font-size:16px}
.arrow{
  font-family:var(--f-mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;
  white-space:nowrap;flex:none;
}
.to-mine{color:var(--mine)}
.to-bless{color:var(--bless)}
.switch-row .done{
  border:1px solid var(--rule-strong);background:var(--surface);border-radius:3px;
  padding:4px 10px;font-size:12px;font-weight:500;flex:none;
}
.switch-row .done:hover{border-color:var(--ink-3)}

/* ---------- empty ---------- */
.empty{
  border:1px dashed var(--rule);border-radius:4px;padding:16px;
  color:var(--ink-3);font-size:13.5px;font-family:var(--f-display);font-style:italic;
}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap">
  <header>
    <h1>Building <span class="amp">&amp;</span> Blessing</h1>
    <p class="sub">What I am responsible for, and what I am only blessing.</p>
  </header>

  <div class="add">
    <input id="new" type="text" placeholder="Add something…" aria-label="Name of the thing to add">
    <button class="primary" id="add-mine">+ Mine</button>
    <button id="add-bless">+ Blessing</button>
  </div>

  <main id="view"></main>
</div>

<script id="state" type="application/json">{"v":2,"items":null}</script>

<script>
(function () {
  "use strict";

  var PRISTINE = "<!doctype html>\n" + document.documentElement.outerHTML;
  var STORE_KEY = "building-and-blessing/v2";

  /* ---------- state ---------- */

  function uid() { return "i" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }

  function normalize(raw) {
    if (!raw) return null;
    // v1 called them entries with a "posture"; carry those names across.
    var src = Array.isArray(raw.items) ? raw.items : (Array.isArray(raw.entries) ? raw.entries : null);
    if (!src) return null;
    return {
      v: 2,
      items: src.map(function (e) {
        e = e || {};
        var list = e.list || (e.posture === "blessing" ? "bless" : "mine");
        if (list === "building") list = "mine";
        if (list === "blessing") list = "bless";
        if (list !== "mine" && list !== "bless" && list !== "switching") list = "mine";
        var target = e.target === "mine" || e.target === "bless" ? e.target : null;
        if (list === "switching" && !target) list = "mine";
        return {
          id: e.id || uid(),
          name: String(e.name || "").slice(0, 400),
          list: list,
          target: list === "switching" ? target : null,
          from: list === "switching" ? (e.from === "bless" ? "bless" : "mine") : null
        };
      })
    };
  }

  function load() {
    try {
      var embedded = normalize(JSON.parse(document.getElementById("state").textContent || "{}"));
      if (embedded) return embedded;
    } catch (err) { /* fall through */ }
    try {
      var stored = localStorage.getItem(STORE_KEY) || localStorage.getItem("building-and-blessing/v1");
      if (stored) {
        var local = normalize(JSON.parse(stored));
        if (local) return local;
      }
    } catch (err) { /* fall through */ }
    return { v: 2, items: [] };
  }

  var state = load();

  /* ---------- persistence ---------- */

  var api = null;
  if (window.claude && typeof window.claude.use === "function") {
    Promise.resolve(window.claude.use("artifact")).then(function (a) { api = a || null; })
      .catch(function () { api = null; });
  }

  var STATE_OPEN = '<script id="state" type="application/' + 'json">';
  var STATE_CLOSE = "<" + "/script>";

  function buildDocument() {
    var start = PRISTINE.indexOf(STATE_OPEN);
    if (start < 0) return PRISTINE;
    var from = start + STATE_OPEN.length;
    var end = PRISTINE.indexOf(STATE_CLOSE, from);
    if (end < 0) return PRISTINE;
    var json = JSON.stringify(state).replace(/</g, "\\u003c");
    return PRISTINE.slice(0, from) + json + PRISTINE.slice(end);
  }

  var timer = null;
  function save() {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (err) { /* private mode */ }
    if (timer) clearTimeout(timer);
    timer = setTimeout(function () {
      if (!api) return;
      try {
        Promise.resolve(api.publish(buildDocument())).catch(function () { /* someone published first */ });
      } catch (err) { /* best effort */ }
    }, 800);
  }

  /* ---------- helpers ---------- */

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function inList(list) {
    return state.items.filter(function (i) { return i.list === list; });
  }
  function indexOfId(id) {
    for (var i = 0; i < state.items.length; i++) if (state.items[i].id === id) return i;
    return -1;
  }

  /* ---------- actions ---------- */

  function add(list) {
    var input = document.getElementById("new");
    var name = input.value.trim();
    if (!name) { input.focus(); return; }
    state.items.push({ id: uid(), name: name, list: list, target: null, from: null });
    input.value = "";
    input.focus();
    save(); render();
  }

  // Reorder within a list: swap with the neighbour that shares this item's list,
  // so moving inside Mine can never step over the line into Blessing.
  function move(id, dir) {
    var idx = indexOfId(id);
    if (idx < 0) return;
    var list = state.items[idx].list;
    var j = idx + dir;
    while (j >= 0 && j < state.items.length && state.items[j].list !== list) j += dir;
    if (j < 0 || j >= state.items.length) return;
    var tmp = state.items[idx];
    state.items[idx] = state.items[j];
    state.items[j] = tmp;
    save(); render(id, dir > 0 ? "down" : "up");
  }

  function beginSwitch(id) {
    var it = state.items[indexOfId(id)];
    if (!it || it.list === "switching") return;
    it.from = it.list;
    it.target = it.list === "mine" ? "bless" : "mine";
    it.list = "switching";
    save(); render();
  }

  function finishSwitch(id) {
    var idx = indexOfId(id);
    var it = state.items[idx];
    if (!it || it.list !== "switching") return;
    it.list = it.target;
    it.target = null;
    it.from = null;
    // Land it at the end of its new list rather than wherever it happened to sit.
    state.items.splice(idx, 1);
    state.items.push(it);
    save(); render();
  }

  function cancelSwitch(id) {
    var it = state.items[indexOfId(id)];
    if (!it || it.list !== "switching") return;
    it.list = it.from || "mine";
    it.target = null;
    it.from = null;
    save(); render();
  }

  function remove(id) {
    var idx = indexOfId(id);
    if (idx < 0) return;
    state.items.splice(idx, 1);
    save(); render();
  }

  function rename(id, name) {
    var it = state.items[indexOfId(id)];
    if (!it) return;
    name = name.trim();
    if (!name || name === it.name) return;
    it.name = name.slice(0, 400);
    save();
  }

  /* ---------- render ---------- */

  function rowHTML(item, rank, list, first, last) {
    return '<li class="row row-' + list + '" data-id="' + esc(item.id) + '">' +
      '<span class="rank">' + rank + "</span>" +
      '<input class="name" value="' + esc(item.name) + '" aria-label="Name">' +
      '<span class="tools">' +
        '<button data-act="up" ' + (first ? "disabled" : "") + ' aria-label="Move up" title="Move up">&#9650;</button>' +
        '<button data-act="down" ' + (last ? "disabled" : "") + ' aria-label="Move down" title="Move down">&#9660;</button>' +
        '<button data-act="switch" aria-label="' +
          (list === "mine" ? "Start handing this off" : "Start taking this on") + '" title="' +
          (list === "mine" ? "Hand off" : "Take on") + '">&#8644;</button>' +
        '<button data-act="del" class="del" aria-label="Remove" title="Remove">&#10005;</button>' +
      "</span></li>";
  }

  function listHTML(list, items, startRank, emptyCopy) {
    if (!items.length) return '<div class="empty">' + esc(emptyCopy) + "</div>";
    return '<ol start="' + startRank + '">' + items.map(function (it, n) {
      return rowHTML(it, startRank + n, list, n === 0, n === items.length - 1);
    }).join("") + "</ol>";
  }

  function switchHTML(items) {
    if (!items.length) return "";
    return '<section class="sec-switch">' +
      '<div class="sec-head"><h2>Switching</h2><span class="n">' + items.length + "</span></div>" +
      '<p class="sec-note">In motion. Not counted on either side until it lands.</p>' +
      "<ul>" + items.map(function (it) {
        var toMine = it.target === "mine";
        return '<li class="switch-row" data-id="' + esc(it.id) + '">' +
          '<span class="arrow ' + (toMine ? "to-mine" : "to-bless") + '">' +
            (toMine ? "&#8594; taking on" : "&#8594; handing off") + "</span>" +
          '<input class="name" value="' + esc(it.name) + '" aria-label="Name">' +
          '<button class="done" data-act="finish">' +
            (toMine ? "It&#8217;s mine now" : "Handed off") + "</button>" +
          '<span class="tools"><button data-act="cancel" aria-label="Cancel the switch" title="Cancel">&#10005;</button></span>' +
        "</li>";
      }).join("") + "</ul></section>";
  }

  function render(focusId, focusDir) {
    var mine = inList("mine");
    var bless = inList("bless");
    var moving = inList("switching");

    document.getElementById("view").innerHTML =
      '<section class="sec-mine">' +
        '<div class="sec-head"><h2>Mine to carry</h2><span class="n">' + mine.length + "</span></div>" +
        '<p class="sec-note">If it stalls, it stalls with me.</p>' +
        listHTML("mine", mine, 1, "Nothing yet. What would go wrong if you walked away tomorrow?") +
      "</section>" +

      switchHTML(moving) +

      '<div class="line"><span>Below the line: only if there is room</span></div>' +

      '<section class="sec-bless">' +
        '<div class="sec-head"><h2>Blessing</h2><span class="n">' + bless.length + "</span></div>" +
        '<p class="sec-note">Someone else carries it. Nice to get to, never ahead of the above.</p>' +
        listHTML("bless", bless, mine.length + 1, "Nothing yet. Whose work do you back without owning it?") +
      "</section>";

    // Keep the arrow keys usable: after a move, put focus back on the button
    // that was just pressed, now at the item's new position.
    if (focusId) {
      var row = document.querySelector('[data-id="' + focusId + '"]');
      if (row) {
        // Prefer the button just pressed. At the end of a list that button is
        // now disabled, so fall back to the opposite one, then to the name --
        // focus must stay on the item that moved, never fall off the page.
        var order = focusDir === "up" ? ["up", "down"] : ["down", "up"];
        var target = null;
        for (var k = 0; k < order.length && !target; k++) {
          var b = row.querySelector('[data-act="' + order[k] + '"]');
          if (b && !b.disabled) target = b;
        }
        (target || row.querySelector(".name")).focus();
      }
    }
  }

  /* ---------- wiring ---------- */

  document.getElementById("add-mine").addEventListener("click", function () { add("mine"); });
  document.getElementById("add-bless").addEventListener("click", function () { add("bless"); });
  document.getElementById("new").addEventListener("keydown", function (ev) {
    if (ev.key === "Enter") add("mine");
  });

  var view = document.getElementById("view");

  view.addEventListener("click", function (ev) {
    var btn = ev.target.closest("[data-act]");
    if (!btn) return;
    var id = btn.closest("[data-id]").dataset.id;
    var act = btn.dataset.act;
    if (act === "up") move(id, -1);
    else if (act === "down") move(id, 1);
    else if (act === "switch") beginSwitch(id);
    else if (act === "finish") finishSwitch(id);
    else if (act === "cancel") cancelSwitch(id);
    else if (act === "del") remove(id);
  });

  view.addEventListener("change", function (ev) {
    if (!ev.target.classList.contains("name")) return;
    rename(ev.target.closest("[data-id]").dataset.id, ev.target.value);
  });

  view.addEventListener("keydown", function (ev) {
    if (ev.key === "Enter" && ev.target.classList.contains("name")) ev.target.blur();
  });

  render();
})();
</script>

<script>
/* Offline support for the hosted copy. Skipped inside a frame (where a published
   artifact runs and no sw.js exists) and on file:// URLs. */
(function () {
  "use strict";
  var framed = true;
  try { framed = window.top !== window.self; } catch (err) { framed = true; }
  if (framed || !("serviceWorker" in navigator)) return;
  if (location.protocol !== "https:" && location.hostname !== "localhost" && location.hostname !== "127.0.0.1") return;

  var hadController = !!navigator.serviceWorker.controller;
  var reloading = false;
  navigator.serviceWorker.addEventListener("controllerchange", function () {
    if (!hadController || reloading) return;
    reloading = true;
    location.reload();
  });
  window.addEventListener("load", function () {
    navigator.serviceWorker.register("sw.js").catch(function () { /* bonus, not required */ });
  });
})();
</script>
